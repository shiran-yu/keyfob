[package]
name = "keyfob"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
description = "API tokens for your shell, your scripts and Claude Code: kept in the OS keystore (or a 0600 file on servers) and handed to one command at a time"
license = "CC-BY-NC-SA-4.0"
repository = "https://github.com/yushiran/keyfob"
readme = "README.md"
keywords = ["secrets", "keychain", "claude-code", "cli", "tokens"]
categories = ["command-line-utilities", "authentication"]

[dependencies]
base64 = "0.22"
libc = "0.2"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
rpassword = "7"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
