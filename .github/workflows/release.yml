name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "CC_$(echo ${{ matrix.target }} | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo test --locked --target ${{ matrix.target }}
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          v=${GITHUB_REF_NAME#v}
          grep -q "^VERSION=$v$" plugins/keyfob/bin/keyfob || { echo "launcher VERSION is not $v"; exit 1; }
          a=keyfob-${{ matrix.target }}.tar.gz
          tar -czf "$a" -C target/${{ matrix.target }}/release keyfob
          if command -v sha256sum >/dev/null; then sha256sum "$a" > "$a.sha256"; else shasum -a 256 "$a" > "$a.sha256"; fi
          cat "$a.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            keyfob-${{ matrix.target }}.tar.gz
            keyfob-${{ matrix.target }}.tar.gz.sha256
